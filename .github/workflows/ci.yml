name: HoneyCloud Platform CI/CD

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Lint Go code
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest

    - name: Lint Terraform
      run: |
        curl -sSL "https://github.com/terraform-linters/tflint/releases/latest/download/tflint_linux_amd64.zip" -o tflint.zip
        unzip tflint.zip
        sudo install tflint /usr/local/bin/
        cd terraform && tflint --recursive

    - name: Lint Helm Charts
      run: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        helm lint charts/*

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run Trivy vulnerability scanner for Dockerfiles
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        security-checks: 'vuln,config,secret'
        severity: 'CRITICAL,HIGH'
        format: 'table'

    - name: Run GoSec for Go code security issues
      uses: securego/gosec@master
      with:
        args: -exclude-dir=vendor -severity=high ./...

  build:
    needs: [lint, security-scan]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        honeypot: [ssh_honeypot, rest_api, web_app]
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: ./honeypots/${{ matrix.honeypot }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ghcr.io/${{ github.repository_owner }}/honeypot-${{ matrix.honeypot }}:${{ github.sha }}
          ghcr.io/${{ github.repository_owner }}/honeypot-${{ matrix.honeypot }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: '1.5.0'

    - name: Configure OpenStack credentials
      env:
        OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
        OS_USERNAME: ${{ secrets.OS_USERNAME }}
        OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
        OS_PROJECT_NAME: ${{ secrets.OS_PROJECT_NAME }}
        OS_USER_DOMAIN_NAME: ${{ secrets.OS_USER_DOMAIN_NAME }}
      run: |
        echo "OpenStack credentials configured"

    - name: Terraform Init and Plan
      run: |
        cd terraform
        terraform init
        terraform workspace select staging || terraform workspace new staging
        terraform plan -var="environment=staging" -out=tfplan

    - name: Terraform Apply
      run: |
        cd terraform
        terraform apply -auto-approve tfplan

    - name: Set up Kubernetes
      run: |
        # Export kubeconfig from terraform output
        cd terraform
        terraform output -raw kubeconfig > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'

    - name: Update Helm dependencies
      run: |
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo add grafana https://grafana.github.io/helm-charts
        helm repo update

    - name: Deploy Monitoring Stack
      run: |
        helm upgrade --install prometheus prometheus-community/prometheus \
          --namespace monitoring --create-namespace \
          --set server.persistentVolume.enabled=true

        helm upgrade --install grafana grafana/grafana \
          --namespace monitoring --create-namespace \
          --set persistence.enabled=true \
          --set service.type=ClusterIP \
          --set ingress.enabled=true

    - name: Deploy Honeypots to Staging
      run: |
        # Update image tags in values file
        for honeypot in ssh_honeypot rest_api web_app; do
          sed -i "s|image: .*honeypot-$honeypot:.*|image: ghcr.io/${{ github.repository_owner }}/honeypot-$honeypot:${{ github.sha }}|g" charts/honeypot/values.yaml
        done
        
        # Install/upgrade each honeypot with Helm
        helm upgrade --install honeypots charts/honeypot \
          --namespace honeypots-staging --create-namespace \
          --set environment=staging \
          --set ingress.enabled=true \
          --set ingress.className=nginx

    - name: Verify Deployment
      run: |
        kubectl rollout status deployment -n honeypots-staging --timeout=180s
        kubectl get pods,svc,ingress -n honeypots-staging

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: '1.5.0'

    - name: Configure OpenStack credentials
      env:
        OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
        OS_USERNAME: ${{ secrets.OS_USERNAME }}
        OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
        OS_PROJECT_NAME: ${{ secrets.OS_PROJECT_NAME }}
        OS_USER_DOMAIN_NAME: ${{ secrets.OS_USER_DOMAIN_NAME }}
      run: |
        echo "OpenStack credentials configured"

    - name: Terraform Init and Plan
      run: |
        cd terraform
        terraform init
        terraform workspace select production || terraform workspace new production
        terraform plan -var="environment=production" -out=tfplan

    - name: Terraform Apply
      run: |
        cd terraform
        terraform apply -auto-approve tfplan

    - name: Set up Kubernetes
      run: |
        # Export kubeconfig from terraform output
        cd terraform
        terraform output -raw kubeconfig > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'

    - name: Update Helm dependencies
      run: |
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo add grafana https://grafana.github.io/helm-charts
        helm repo add loki https://grafana.github.io/loki/charts
        helm repo update

    - name: Deploy Monitoring Stack
      run: |
        helm upgrade --install prometheus prometheus-community/prometheus \
          --namespace monitoring --create-namespace \
          --set server.persistentVolume.enabled=true

        helm upgrade --install loki loki/loki-stack \
          --namespace monitoring --create-namespace \
          --set grafana.enabled=false \
          --set prometheus.enabled=false

        helm upgrade --install grafana grafana/grafana \
          --namespace monitoring --create-namespace \
          --set persistence.enabled=true \
          --set service.type=ClusterIP \
          --set ingress.enabled=true

    - name: Deploy Honeypots to Production
      run: |
        # Deploy with blue/green strategy
        DEPLOY_ID=$(date +%s)
        
        # Update image tags in values file
        for honeypot in ssh_honeypot rest_api web_app; do
          sed -i "s|image: .*honeypot-$honeypot:.*|image: ghcr.io/${{ github.repository_owner }}/honeypot-$honeypot:${{ github.sha }}|g" charts/honeypot/values.yaml
        done
        
        # Install/upgrade each honeypot with Helm
        helm upgrade --install honeypots charts/honeypot \
          --namespace honeypots-production --create-namespace \
          --set environment=production \
          --set ingress.enabled=true \
          --set ingress.className=nginx \
          --set deploymentStrategy=blue-green \
          --set blueGreen.activeColor=blue \
          --set blueGreen.deployId=$DEPLOY_ID

    - name: Verify Production Deployment
      run: |
        kubectl rollout status deployment -n honeypots-production --timeout=300s
        kubectl get pods,svc,ingress -n honeypots-production
